<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تجارت — نوری باباجان</title>

    <style>
        body {
            margin: 0;
            background: #f4f0e7;
            color: #263238;
            font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
            text-align: center;
        }

        header {
            background: #173f35;
            color: white;
            padding: 50px 20px;

            font-size: 42px;
        }

            display: block;
            background: white;
            color: #263238;
            text-decoration: none;
            margin: 20px 0;
            padding: 28px 20px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin: 0 0 8px;
            color: #173f35;
            font-size: 28px;
        }

        .card p {
            margin: 0;
            font-size: 18px;
        }

        .back {
            display: inline-block;
            margin: 30px 0;
            padding: 12px 25px;
            background: #173f35;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        footer {
            margin-top: 40px;
            padding: 25px;
            background: #173f35;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>🏢 تجارت</h1>
        <p>کاروبار اور تجارتی سرگرمیاں</p>
    </header>

    <main class="container">

        <a href="#" class="card">

        </a>

        </a>

        <a href="#" class="card">
            <h2>معمور چکی آٹا</h2>
            <p>معیاری چکی آٹا</p>
        </a>

        <a href="#" class="card">
            <h2>پشاوری اینٹ</h2>
            <p>تعمیراتی اینٹ</p>
        </a>

        <a href="../" class="back">
            ← مرکزی صفحہ
        </a>

    </main>

    <footer>
        © 2026 نوری باباجان
    </footer>
