<!DOCTYPE html>
<html lang="ur" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نوری باباجان</title>

    <meta name="description"
        content="نوری باباجان — نورِ ہدایت، ابو ماثور کی نثر، مجذوب کی شاعری اور کاروبار">

    <style>
        body {
            margin: 0;
            font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", serif;
            background: #f5f1e8;
            color: #263238;
            text-align: center;
        }

        header {
            background: #173f35;
            color: white;
            padding: 45px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        header p {
            font-size: 20px;
            margin-top: 12px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: #263238;
            background: white;
            margin: 22px 0;
            padding: 28px 20px;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .card p {
            margin: 0;
            font-size: 18px;
        }

        .footer {
            margin-top: 50px;
            padding: 25px;
            background: #173f35;
            color: white;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>نوری باباجان</h1>
        <p>حرف، خیال، احساس اور ہدایت کا سفر</p>
    </header>

    <main class="container">

        <a href="#" class="card">
            <h2>🌙 نوری باباجان</h2>
            <p>نورِ ہدایت</p>
        </a>

        <a href="#" class="card">
            <h2>✍️ ابو ماثور</h2>
            <p>نثر — ناول، کہانیاں، مضامین اور سنہری یادیں</p>
        </a>

        <a href="#" class="card">
            <h2>🖋️ مجذوب</h2>
            <p>شاعری — غزلیں، نظمیں اور دیگر شعری تخلیقات</p>
        </a>

        <a href="#" class="card">
            <h2>🏢 کاروبار</h2>
            <p>کاروباری سرگرمیاں اور ادارے</p>
        </a>

    </main>

    <footer class="footer">
        © 2026 نوری باباجان — جملہ حقوق محفوظ ہیں
    </footer>

</body>

  </html>
